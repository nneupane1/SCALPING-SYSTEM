app:
  name: scalping-system
  mode: paper
  debug: true

account:
  initial_equity: 20000
  base_currency: EUR

market:
  symbol: BTCUSDT
  base_timeframe: 1m
  execution_timeframe: 5m
  context_timeframes:
    - 15m
    - 1h
  supported_execution_timeframes:
    - 5m
    - 15m

sessions:
  enabled: true
  timezone: Europe/Berlin
  active_windows:
    - name: london
      start: "08:00"
      end: "11:00"
    - name: new_york
      start: "14:30"
      end: "17:30"

storage:
  root: data_storage
  cache_limit: 5000

history:
  start_date: "2024-01-01"
  end_date: "2024-03-31"

binance:
  base_url: "https://api.binance.com"
  klines_path: "/api/v3/klines"
  default_interval: "1m"
  historical_limit: 1000
  recent_limit: 500
  request_timeout_seconds: 15
  retry_attempts: 5
  retry_backoff_seconds: 1.5
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  retry_logging_enabled: true
  ssl_verify: true
  ca_bundle_path:
  throttle_seconds: 0.2
  closed_klines_only: true

downloads:
  history:
    checkpoint_dir: "_checkpoints"
    partial_suffix: ".partial.csv"
    checkpoint_suffix: ".checkpoint.json"
    resume_enabled: true
    status_every_batches: 10
    save_every_batches: 1
    cleanup_partial_on_complete: true

resample:
  closed: "left"
  label: "right"
  drop_incomplete: true

backtest:
  enabled: true
  checkpoint_dir: "_checkpoints"
  checkpoint_suffix: ".checkpoint.json"
  save_every_steps: 100
  output_dir: "backtest/output"
  resume_enabled: true

replay:
  enabled: true
  checkpoint_dir: "_checkpoints"
  checkpoint_suffix: ".checkpoint.json"
  save_every_steps: 50
  output_dir: "replay/output"
  resume_enabled: true

transport:
  websocket_broadcast_buffer: 1000
