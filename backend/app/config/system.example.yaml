app:
  name: scalping-system
  mode: paper
  debug: true

account:
  initial_equity: 25000
  base_currency: EUR

market:
  symbol: BTCUSDT
  watchlist_symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - LINKUSDT
    - XRPUSDT
    - AAVEUSDT
    - TRXUSDT
  base_timeframe: 1m
  execution_timeframe: 5m
  context_timeframes:
    - 15m
  supported_execution_timeframes:
    - 5m
    - 15m

sessions:
  enabled: true
  timezone: Europe/Berlin
  active_windows:
    - name: london
      start: "08:00"
      end: "11:00"
    - name: new_york
      start: "14:30"
      end: "17:30"

storage:
  root: data_storage
  cache_limit: 5000

history:
  start_date: "2018-01-01 00:00:00"
  end_date: "yesterday_midnight"

binance:
  base_url: "https://api.binance.com"
  websocket_stream_url: "wss://stream.binance.com:9443/stream?streams="
  websocket_api_url: "wss://ws-api.binance.com:443/ws-api/v3"
  klines_path: "/api/v3/klines"
  exchange_info_path: "/api/v3/exchangeInfo"
  order_path: "/api/v3/order"
  open_orders_path: "/api/v3/openOrders"
  account_path: "/api/v3/account"
  default_interval: "1m"
  historical_limit: 1000
  recent_limit: 500
  request_timeout_seconds: 15
  retry_attempts: 5
  retry_backoff_seconds: 1.5
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  retry_logging_enabled: true
  ssl_verify: true
  ca_bundle_path:
  throttle_seconds: 0.2
  closed_klines_only: true
  order_submit_retry_attempts: 3
  order_submit_retry_delay_seconds: 1.0
  order_fill_timeout_seconds: 4.0
  user_stream_recv_window: 5000
  user_stream_reconnect_seconds: 5
  market_stream_reconnect_seconds: 5
  stream_inactivity_timeout_seconds: 90
  exchange_info_cache_seconds: 300

downloads:
  history:
    checkpoint_dir: "_checkpoints"
    partial_suffix: ".partial.csv"
    checkpoint_suffix: ".checkpoint.json"
    resume_enabled: true
    status_every_batches: 10
    save_every_batches: 1
    cleanup_partial_on_complete: true

resample:
  closed: "left"
  label: "right"
  drop_incomplete: true

backtest:
  enabled: true
  checkpoint_dir: "_checkpoints"
  checkpoint_suffix: ".checkpoint.json"
  save_every_steps: 100
  output_dir: "backtest/output"
  resume_enabled: true
  gap_aware: true
  force_flat_before_gap: true
  post_gap_cooldown_bars: 1
  output_gap_windows: true

replay:
  enabled: true
  checkpoint_dir: "_checkpoints"
  checkpoint_suffix: ".checkpoint.json"
  save_every_steps: 50
  output_dir: "replay/output"
  resume_enabled: true

paper:
  enabled: true
  checkpoint_dir: "_checkpoints"
  checkpoint_suffix: ".checkpoint.json"
  output_dir: "paper/output"
  poll_seconds: 15
  recent_limit: 500
  warmup_base_candles: 1000
  save_every_polls: 1
  resume_enabled: true

live:
  enabled: true
  checkpoint_dir: "_checkpoints"
  checkpoint_suffix: ".checkpoint.json"
  output_dir: "live/output"
  poll_seconds: 15
  recent_limit: 500
  warmup_base_candles: 1000
  save_every_polls: 1
  resume_enabled: true

transport:
  websocket_broadcast_buffer: 1000
